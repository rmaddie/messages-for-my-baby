<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Messages for My Baby 🤍🌸</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');

:root{
  --lav:#eee9fb;
  --lav2:#e5ddf7;
  --purple:#765a98;
  --purple2:#9278b2;
  --pink:#e8b8ce;
  --rose:#c986a8;
  --ink:#51475b;
  --muted:#988e9e;
  --white:#fffaff;
  --danger:#b86b7e;
  --shadow:0 12px 35px rgba(102,77,126,.12);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:"DM Sans",sans-serif;
  background:
    radial-gradient(circle at 10% 10%,rgba(255,255,255,.9) 0 4px,transparent 5px),
    radial-gradient(circle at 90% 20%,rgba(255,255,255,.8) 0 3px,transparent 4px),
    linear-gradient(135deg,#f8f5ff,#fdf7fa 48%,#eee9fb);
}

body:before{
  content:"🌸  ✿  🌸  ✿  🌸  ✿  🌸";
  position:fixed;
  top:8px;
  left:0;
  width:100%;
  text-align:center;
  opacity:.32;
  font-size:22px;
  pointer-events:none;
}

.wrap{
  width:min(1050px,92%);
  margin:0 auto;
  padding:55px 0 60px;
}

header{
  text-align:center;
  margin-bottom:28px;
}

h1{
  margin:0;
  font-family:"Caveat",cursive;
  font-size:54px;
  color:var(--purple);
  line-height:1;
}

.subtitle{
  margin-top:10px;
  color:var(--muted);
  font-size:14px;
}

.card{
  background:rgba(255,250,255,.88);
  border:1px solid rgba(146,120,178,.18);
  border-radius:25px;
  box-shadow:var(--shadow);
  padding:24px;
  margin-bottom:22px;
  backdrop-filter:blur(10px);
}

.auth{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  justify-content:center;
}

input,textarea{
  width:100%;
  border:1px solid #ded4e8;
  background:#fff;
  border-radius:15px;
  padding:13px 15px;
  font:inherit;
  color:var(--ink);
  outline:none;
}

input:focus,textarea:focus{
  border-color:var(--purple2);
  box-shadow:0 0 0 3px rgba(146,120,178,.12);
}

textarea{
  min-height:150px;
  resize:vertical;
}

button{
  border:0;
  border-radius:13px;
  padding:10px 16px;
  font:600 14px "DM Sans",sans-serif;
  cursor:pointer;
  color:white;
  background:var(--purple);
  transition:.18s ease;
}

button:hover{
  transform:translateY(-1px);
  opacity:.92;
}

button.secondary{
  background:#e6dff2;
  color:var(--purple);
}

button.danger{
  background:#f0d7df;
  color:var(--danger);
}

button.small{
  padding:7px 11px;
  font-size:12px;
}

.status{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-top:10px;
}

.editor{
  display:grid;
  gap:13px;
}

.editor-actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

.attachments{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.attachment-chip{
  display:flex;
  align-items:center;
  gap:7px;
  background:#f1ebfa;
  border-radius:12px;
  padding:8px 10px;
  font-size:12px;
}

.posts-top{
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.search{
  max-width:330px;
}

.post{
  background:#fff;
  border:1px solid #eee5f3;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
}

.post:last-child{
  margin-bottom:0;
}

.post-date{
  color:var(--muted);
  font-size:12px;
  margin-bottom:12px;
}

.post-body{
  white-space:pre-wrap;
  line-height:1.65;
  font-size:15px;
}

.post-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}

.media-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:10px;
  margin-top:15px;
}

.media-grid img,
.media-grid video{
  width:100%;
  max-height:260px;
  object-fit:cover;
  border-radius:14px;
  background:#f3eef7;
}

.media-grid audio{
  width:100%;
}

.file-link{
  display:block;
  padding:11px 13px;
  border-radius:13px;
  background:#f5f0f9;
  color:var(--purple);
  text-decoration:none;
  font-size:13px;
  overflow:hidden;
  text-overflow:ellipsis;
}

.reactions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:17px;
}

.reaction{
  background:#f5edf8;
  color:var(--ink);
  border:1px solid #e6dbea;
  padding:7px 10px;
  border-radius:999px;
  font-size:13px;
}

.comments{
  margin-top:18px;
  border-top:1px solid #eee5f3;
  padding-top:15px;
}

.comments-title{
  font-weight:700;
  font-size:13px;
  color:var(--purple);
  margin-bottom:10px;
}

.comment{
  background:#faf7fc;
  border-radius:13px;
  padding:10px 12px;
  margin-bottom:8px;
  font-size:13px;
  line-height:1.5;
}

.commenthead{
  font-weight:700;
  margin-bottom:4px;
}

.commentdate{
  color:var(--muted);
  font-weight:400;
  font-size:11px;
  margin-left:7px;
}

.comment-delete{
  float:right;
  padding:4px 8px;
  font-size:10px;
  background:#f0d7df;
  color:var(--danger);
}

.comment-form{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.comment-form input{
  flex:1;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px 10px;
  font-size:14px;
}

.hidden{
  display:none!important;
}

footer{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:30px;
}

@media(max-width:650px){
  h1{
    font-size:43px;
  }

  .card{
    padding:17px;
    border-radius:20px;
  }

  .comment-form{
    flex-direction:column;
  }

  .comment-form button{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <h1>Messages for My Baby 🤍🌸</h1>
  <div class="subtitle">
    Things I wanted to tell you, but didn't.
  </div>
</header>

<div class="card">
  <div id="loggedOut">
    <div class="auth">
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">
      <button id="signInBtn">Sign in</button>
      <button id="signUpBtn" class="secondary">Create account</button>
    </div>
    <div id="authStatus" class="status"></div>
  </div>

  <div id="loggedIn" class="hidden">
    <div class="auth">
      <span id="userEmail"></span>
      <button id="signOutBtn" class="secondary">Sign out</button>
    </div>
    <div class="status">
      Your posts are saved to your owner account.
    </div>
  </div>
</div>

<div id="editorCard" class="card hidden">

  <div class="editor">

    <textarea
      id="messageBody"
      placeholder="BABY, GUESS WHAT... 🤍🌸"
    ></textarea>

    <input
      id="fileInput"
      type="file"
      multiple
    >

    <div id="selectedFiles" class="attachments"></div>

    <div class="editor-actions">
      <button id="saveBtn">Save message 🤍</button>
      <button id="cancelEditBtn" class="secondary hidden">
        Cancel edit
      </button>
      <button id="clearBtn" class="secondary">
        Clear
      </button>
    </div>

    <div id="saveStatus" class="status"></div>

  </div>
</div>

<div class="card">

  <div class="posts-top">
    <div>
      <strong>Messages 🌸</strong>
    </div>

    <input
      id="searchInput"
      class="search"
      type="search"
      placeholder="Search messages..."
    >
  </div>

  <div id="posts"></div>

</div>

<footer>
  For all the “BABY, GUESS WHAT—” moments that never got sent. 🤍
</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://botpymtjxkwfuxzzbprj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_qbZN_IgzgkCSqtarujiYAw_raquOF0A";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let user = null;
let editingId = null;
let currentPosts = [];
let selectedFiles = [];

const $ = id => document.getElementById(id);

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatDate(date){
  return new Date(date).toLocaleString(
    undefined,
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );
}

function setStatus(message){
  $("authStatus").textContent = message || "";
}

function setSaveStatus(message){
  $("saveStatus").textContent = message || "";
}

async function init(){

  const {
    data:{session}
  } = await db.auth.getSession();

  user = session?.user || null;

  updateAuthUI();
  await loadPosts();

  db.auth.onAuthStateChange(
    async (_event,session) => {

      user = session?.user || null;

      updateAuthUI();
      await loadPosts();

    }
  );
}

function updateAuthUI(){

  if(user){

    $("loggedOut").classList.add("hidden");
    $("loggedIn").classList.remove("hidden");
    $("editorCard").classList.remove("hidden");

    $("userEmail").textContent =
      user.email || "";

  }else{

    $("loggedOut").classList.remove("hidden");
    $("loggedIn").classList.add("hidden");
    $("editorCard").classList.add("hidden");

  }
}

$("signUpBtn").addEventListener(
  "click",
  async ()=>{

    const email =
      $("email").value.trim();

    const password =
      $("password").value;

    if(!email || !password){

      setStatus("Please enter an email and password.");
      return;

    }

    setStatus("Creating your account...");

    const {error} =
      await db.auth.signUp({
        email,
        password
      });

    if(error){

      setStatus(error.message);

    }else{

      setStatus(
        "Account created! Check your email if confirmation is required."
      );

    }

  }
);

$("signInBtn").addEventListener(
  "click",
  async ()=>{

    const email =
      $("email").value.trim();

    const password =
      $("password").value;

    if(!email || !password){

      setStatus("Please enter your email and password.");
      return;

    }

    setStatus("Signing in...");

    const {error} =
      await db.auth.signInWithPassword({
        email,
        password
      });

    if(error){

      setStatus(error.message);

    }else{

      setStatus("");

    }

  }
);

$("signOutBtn").addEventListener(
  "click",
  async ()=>{

    await db.auth.signOut();

  }
);

$("fileInput").addEventListener(
  "change",
  event=>{

    selectedFiles =
      Array.from(event.target.files || []);

    renderSelectedFiles();

  }
);

function renderSelectedFiles(){

  $("selectedFiles").innerHTML =
    selectedFiles.map(
      (file,index)=>`

      <div class="attachment-chip">

        📎 ${esc(file.name)}

        <button
          type="button"
          class="small danger"
          onclick="removeSelectedFile(${index})"
        >
          ×
        </button>

      </div>

    `
    ).join("");

}

window.removeSelectedFile =
  function(index){

    selectedFiles.splice(index,1);

    renderSelectedFiles();

    $("fileInput").value = "";

  };

$("clearBtn").addEventListener(
  "click",
  clearEditor
);

$("cancelEditBtn").addEventListener(
  "click",
  clearEditor
);

function clearEditor(){

  editingId = null;

  $("messageBody").value = "";

  $("fileInput").value = "";

  selectedFiles = [];

  renderSelectedFiles();

  $("saveBtn").textContent =
    "Save message 🤍";

  $("cancelEditBtn")
    .classList.add("hidden");

  setSaveStatus("");

}

$("saveBtn").addEventListener(
  "click",
  saveMessage
);

async function saveMessage(){

  if(!user){

    setSaveStatus("Please sign in first.");
    return;

  }

  const body =
    $("messageBody").value.trim();

  if(!body){

    setSaveStatus("Write something first. 🤍");
    return;

  }

  $("saveBtn").disabled = true;
  setSaveStatus(
    editingId
      ? "Updating..."
      : "Saving..."
  );

  try{

    let messageId = editingId;

    if(editingId){

      const {error} =
        await db
          .from("messages")
          .update({
            title:"",
            body,
            updated_at:new Date().toISOString()
          })
          .eq("id",editingId)
          .eq("user_id",user.id);

      if(error) throw error;

    }else{

      const {data,error} =
        await db
          .from("messages")
          .insert({
            user_id:user.id,
            title:"",
            body
          })
          .select()
          .single();

      if(error) throw error;

      messageId = data.id;

    }

    for(const file of selectedFiles){

      const safeName =
        file.name
          .replace(/[^a-zA-Z0-9._-]/g,"_");

      const path =
        `${user.id}/${messageId}/${Date.now()}_${safeName}`;

      const {error:uploadError} =
        await db.storage
          .from("message-attachments")
          .upload(
            path,
            file,
            {
              upsert:false,
              contentType:file.type || undefined
            }
          );

      if(uploadError) throw uploadError;

      const {error:metaError} =
        await db
          .from("message_attachments")
          .insert({
            message_id:messageId,
            user_id:user.id,
            file_name:file.name,
            file_path:path,
            mime_type:file.type || null,
            size_bytes:file.size
          });

      if(metaError) throw metaError;

    }

    clearEditor();

    setSaveStatus(
      editingId
        ? "Updated! 🤍"
        : "Saved! 🤍"
    );

    await loadPosts();

  }catch(error){

    console.error(error);

    setSaveStatus(
      error.message ||
      "Something went wrong."
    );

  }finally{

    $("saveBtn").disabled = false;

  }

}

async function loadPosts(){

  const {data,error} =
    await db
      .from("messages")
      .select("*")
      .order("created_at",{ascending:false});

  if(error){

    console.error(error);

    $("posts").innerHTML =
      `<div class="empty">
        Unable to load messages.
      </div>`;

    return;

  }

  currentPosts = data || [];

  await renderPosts();

}

async function renderPosts(){

  const query =
    $("searchInput").value
      .trim()
      .toLowerCase();

  const filtered =
    currentPosts.filter(
      post =>
        !query ||
        (post.body || "")
          .toLowerCase()
          .includes(query)
    );

  if(!filtered.length){

    $("posts").innerHTML =
      `<div class="empty">
        No messages yet. 🌸
      </div>`;

    return;

  }

  const html = [];

  for(const post of filtered){

    const attachments =
      await getAttachments(post.id);

    const comments =
      await getComments(post.id);

    const reactions =
      await getReactions(post.id);

    html.push(
      renderPost(
        post,
        attachments,
        comments,
        reactions
      )
    );

  }

  $("posts").innerHTML =
    html.join("");

  bindPostEvents();

}

async function getAttachments(messageId){

  const {data,error} =
    await db
      .from("message_attachments")
      .select("*")
      .eq("message_id",messageId)
      .order("created_at",{ascending:true});

  if(error){

    console.error(error);
    return [];

  }

  return data || [];

}

async function getComments(messageId){

  const {data,error} =
    await db
      .from("public_message_comments")
      .select("*")
      .eq("message_id",messageId)
      .order("created_at",{ascending:true});

  if(error){

    console.error(error);
    return [];

  }

  return data || [];

}

async function getReactions(messageId){

  const {data,error} =
    await db
      .from("public_message_reactions")
      .select("emoji")
      .eq("message_id",messageId);

  if(error){

    console.error(error);
    return {};

  }

  const counts = {};

  (data || []).forEach(
    row=>{
      counts[row.emoji] =
        (counts[row.emoji] || 0) + 1;
    }
  );

  return counts;

}

function renderPost(
  post,
  attachments,
  comments,
  reactions
){

  const media =
    attachments.map(
      file=>{

        const {
          data
        } =
          db.storage
            .from("message-attachments")
            .getPublicUrl(
              file.file_path
            );

        const url =
          data.publicUrl;

        if(
          file.mime_type &&
          file.mime_type.startsWith("image/")
        ){

          return `
            <img
              src="${esc(url)}"
              alt="${esc(file.file_name)}"
              loading="lazy"
            >
          `;

        }

        if(
          file.mime_type &&
          file.mime_type.startsWith("video/")
        ){

          return `
            <video
              controls
              src="${esc(url)}"
            ></video>
          `;

        }

        if(
          file.mime_type &&
          file.mime_type.startsWith("audio/")
        ){

          return `
            <audio
              controls
              src="${esc(url)}"
            ></audio>
          `;

        }

        return `
          <a
            class="file-link"
            href="${esc(url)}"
            target="_blank"
            rel="noopener"
          >
            📎 ${esc(file.file_name)}
          </a>
        `;

      }
    ).join("");

  const reactionList = [
    "🤍",
    "❤️",
    "🌸",
    "🥹",
    "😂",
    "😭",
    "🫶",
    "✨"
  ];

  const reactionHTML =
    reactionList.map(
      emoji=>`

      <button
        class="reaction"
        data-reaction="${emoji}"
        data-message-id="${post.id}"
      >
        ${emoji}
        ${reactions[emoji] || ""}
      </button>

      `
    ).join("");

  const commentsHTML =
    comments.map(
      c=>`

      <div
        class="comment"
        data-comment-id="${c.id}"
      >

        <div class="commenthead">

          ${esc(c.display_name)}

          <span class="commentdate">
            ${formatDate(c.created_at)}
          </span>

          ${
            user
              ? `
                <button
                  class="comment-delete"
                  data-comment-id="${c.id}"
                >
                  Delete
                </button>
              `
              : ""
          }

        </div>

        <div>
          ${esc(c.body)}
        </div>

      </div>

      `
    ).join("");

  return `

    <article
      class="post"
      data-post-id="${post.id}"
    >

      <div class="post-date">
        ${formatDate(post.created_at)}
      </div>

      <div class="post-body">
        ${esc(post.body)}
      </div>

      ${
        media
          ? `
            <div class="media-grid">
              ${media}
            </div>
          `
          : ""
      }

      <div class="reactions">
        ${reactionHTML}
      </div>

      <div class="comments">

        <div class="comments-title">
          💬 Replies
        </div>

        ${
          commentsHTML ||
          `<div class="status">
             No replies yet. 🌸
           </div>`
        }

        <div class="comment-form">

          <input
            class="comment-name"
            placeholder="Your name"
            maxlength="50"
          >

          <input
            class="comment-body"
            placeholder="Leave a little message... 🤍"
            maxlength="1000"
          >

          <button
            class="comment-submit"
            data-message-id="${post.id}"
          >
            Reply
          </button>

        </div>

      </div>

      ${
        user &&
        post.user_id === user.id
          ? `
            <div class="post-actions">

              <button
                class="small secondary edit-post"
                data-post-id="${post.id}"
              >
                Edit
              </button>

              <button
                class="small danger delete-post"
                data-post-id="${post.id}"
              >
                Delete
              </button>

            </div>
          `
          : ""
      }

    </article>

  `;

}

function bindPostEvents(){

  document
    .querySelectorAll(".reaction")
    .forEach(
      button=>{

        button.addEventListener(
          "click",
          async ()=>{

            const emoji =
              button.dataset.reaction;

            const messageId =
              button.dataset.messageId;

            let visitorId =
              localStorage.getItem(
                "baby_visitor_id"
              );

            if(!visitorId){

              visitorId =
                crypto.randomUUID();

              localStorage.setItem(
                "baby_visitor_id",
                visitorId
              );

            }

            const {error} =
              await db
                .from("public_message_reactions")
                .insert({
                  message_id:messageId,
                  visitor_id:visitorId,
                  emoji
                });

            if(error){

              console.error(error);
              return;

            }

            await loadPosts();

          }
        );

      }
    );

  document
    .querySelectorAll(".comment-submit")
    .forEach(
      button=>{

        button.addEventListener(
          "click",
          async ()=>{

            const post =
              button.closest(".post");

            const name =
              post
                .querySelector(".comment-name")
                .value
                .trim();

            const body =
              post
                .querySelector(".comment-body")
                .value
                .trim();

            if(!name || !body){

              alert(
                "Please enter your name and message."
              );

              return;

            }

            let visitorId =
              localStorage.getItem(
                "baby_visitor_id"
              );

            if(!visitorId){

              visitorId =
                crypto.randomUUID();

              localStorage.setItem(
                "baby_visitor_id",
                visitorId
              );

            }

            button.disabled = true;

            const {error} =
              await db
                .from("public_message_comments")
                .insert({
                  message_id:
                    button.dataset.messageId,
                  visitor_id:visitorId,
                  display_name:name,
                  body
                });

            button.disabled = false;

            if(error){

              console.error(error);

              alert(
                error.message ||
                "Unable to post reply."
              );

              return;

            }

            await loadPosts();

          }
        );

      }
    );

  document
    .querySelectorAll(".comment-delete")
    .forEach(
      button=>{

        button.addEventListener(
          "click",
          async ()=>{

            const confirmed =
              confirm(
                "Delete this comment?"
              );

            if(!confirmed) return;

            const commentId =
              button.dataset.commentId;

            const {error} =
              await db
                .from("public_message_comments")
                .delete()
                .eq("id",commentId);

            if(error){

              console.error(error);

              alert(
                "Unable to delete this comment. " +
                "Make sure the Supabase owner-delete policy has been added."
              );

              return;

            }

            await loadPosts();

          }
        );

      }
    );

  document
    .querySelectorAll(".edit-post")
    .forEach(
      button=>{

        button.addEventListener(
          "click",
          ()=>{

            const id =
              button.dataset.postId;

            const post =
              currentPosts.find(
                p=>p.id === id
              );

            if(!post) return;

            editingId = id;

            $("messageBody").value =
              post.body || "";

            selectedFiles = [];

            $("fileInput").value = "";

            renderSelectedFiles();

            $("saveBtn").textContent =
              "Update message 🤍";

            $("cancelEditBtn")
              .classList.remove("hidden");

            $("editorCard")
              .scrollIntoView({
                behavior:"smooth"
              });

          }
        );

      }
    );

  document
    .querySelectorAll(".delete-post")
    .forEach(
      button=>{

        button.addEventListener(
          "click",
          async ()=>{

            const confirmed =
              confirm(
                "Delete this message and its attachments?"
              );

            if(!confirmed) return;

            const id =
              button.dataset.postId;

            await deletePost(id);

          }
        );

      }
    );

}

async function deletePost(id){

  try{

    const attachments =
      await getAttachments(id);

    for(const file of attachments){

      await db.storage
        .from("message-attachments")
        .remove([
          file.file_path
        ]);

    }

    const {error} =
      await db
        .from("messages")
        .delete()
        .eq("id",id)
        .eq("user_id",user.id);

    if(error) throw error;

    await loadPosts();

  }catch(error){

    console.error(error);

    alert(
      error.message ||
      "Unable to delete message."
    );

  }

}

$("searchInput").addEventListener(
  "input",
  renderPosts
);

init();

</script>

</body>
</html>
